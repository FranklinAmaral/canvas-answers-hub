services:
  graderai-app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: graderai-app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - graderai-network
    depends_on:
      - graderai-mysql

  graderai-nginx:
    image: nginx:1.27-alpine
    container_name: graderai-nginx
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - graderai-network
    depends_on:
      - graderai-app

  graderai-mysql:
    image: mysql:8.4
    command: --mysql-native-password=ON
    container_name: graderai-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes:
      - graderai-mysql-data:/var/lib/mysql
    networks:
      - graderai-network

  graderai-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: graderai-worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=300 -vvv
    volumes:
      - ./:/var/www/html
    networks:
      - graderai-network
    depends_on:
      - graderai-app
      - graderai-mysql

  graderai-scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: graderai-scheduler
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - ./:/var/www/html
    networks:
      - graderai-network
    depends_on:
      - graderai-app
      - graderai-mysql

networks:
  graderai-network:
    name: graderai-network

volumes:
  graderai-mysql-data:
    name: ${GRADERAI_DB_VOLUME:-graderai-mysql-data}
